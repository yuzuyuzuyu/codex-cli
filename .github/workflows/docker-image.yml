name: Build Docker image

# Publishes on merge. The CODEX_VERSION pin in the Dockerfile is the single
# source of truth: Renovate PRs the bump, CI proves it, and landing it here
# builds and pushes :latest plus the version tag. Manual dispatch accepts a
# version override as an escape hatch (the override is passed as a build arg
# and tagged as given, bypassing the pin).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-image.yml
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      version:
        description: "@openai/codex version to build (default: the Dockerfile pin)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        uses: yuzuyuzuyu/repo-automation/actions/publication@c691d5f2b7a126cdbbbe62811329ca24f8b643a9 # v1.0.0

  build:
    if: needs.publication-ready.outputs.ready == 'true'
    needs: publication-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: repo
        name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: version
        name: Read the @openai/codex version pin from the Dockerfile
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          pinned=$(sed -n 's/^ARG CODEX_VERSION=//p' Dockerfile)
          version="${REQUESTED:-$pinned}"
          echo "resolved @openai/codex version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
          build-args: |
            CODEX_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
