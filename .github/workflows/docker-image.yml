name: Build Docker image

# Publishes on merge. The CODEX_VERSION pin in the Dockerfile is the single
# source of truth: Renovate PRs the bump, CI proves it, and landing it here
# builds and pushes :latest plus the version tag. Manual dispatch accepts a
# version override as an escape hatch (the override is passed as a build arg
# and tagged as given, bypassing the pin).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-image.yml
  workflow_dispatch:
    inputs:
      version:
        description: "@openai/codex version to build (default: the Dockerfile pin)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: repo
        name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: version
        name: Read the @openai/codex version pin from the Dockerfile
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          pinned=$(sed -n 's/^ARG CODEX_VERSION=//p' Dockerfile)
          version="${REQUESTED:-$pinned}"
          echo "resolved @openai/codex version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CODEX_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
