name: Build Docker image

# Publishes the locked package version after its current revision passes CI.
# Manual dispatch rebuilds that reviewed version; it cannot bypass the lock.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/docker-image.yml
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Optional assertion: must match the reviewed package lock"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  publication-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the current revision and its CI
        id: gate
        uses: yuzuyuzuyu/repo-automation/actions/publication@5e43da5687b25e015d70f842804b4aea4c9dc5af # v1.0.25

  build:
    if: needs.publication-ready.outputs.ready == 'true'
    needs: publication-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: repo
        name: Lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: version
        name: Read the @openai/codex version pin from package.json
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          pinned=$(jq -r '.dependencies["@openai/codex"]' package.json)
          version="$pinned"
          test -z "$REQUESTED" || test "$REQUESTED" = "$pinned"
          echo "resolved @openai/codex version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # renovate: datasource=docker depName=tonistiigi/binfmt
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # renovate: datasource=github-releases depName=docker/buildx
          version: v0.38.1
          # renovate: datasource=docker depName=moby/buildkit
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
