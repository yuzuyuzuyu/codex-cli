name: Renovate


on:
  schedule:
    # Hourly; keep the minute offset to spread runner load.
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    uses: yuzuyuzuyu/repo-automation/.github/workflows/renovate-runner.yml@7dfff82b9b849b90ea19eac1f6efdd595b73544f # v1.0.32
    with:
      app-client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      native-automerge: true
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      RENOVATE_GITHUB_LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
